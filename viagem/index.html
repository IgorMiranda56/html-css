<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular Combustível</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <video src="/video/3125396-hd_1280_720_25fps.mp4" autoplay muted loop class="fundo"></video>

    <div class="central">
        <span>Distância da Viagem(Km)</span>
        <input type="text" id="distancia" placeholder="Ex: 150"> 
        <span>Consumo do Veículo(Km/L)</span>
        <input type="text" id="consumo" placeholder="Ex: 17">
        <span>Preço do Combutível</span>
        <input type="text" id="preco" placeholder="Ex: 5.99">

        <button id="botao">Calcular</button>
        <span id="resultado"></span>
    </div>

    <script src="/js/calculo.js"></script>
</body>
</html>
